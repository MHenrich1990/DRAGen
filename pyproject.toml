[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dragen"
version = "0.2.0"
description = "Discrete RVE generation with grain sources from trained GANs, voxel and tetrahedral meshes"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Manuel Henrich" }]
# Core: voxel RVE, tetrahedral mesh, library API and exports. Everything else is an extra and is
# only imported inside the functions that need it.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6",
    "gmsh>=4.13",
    "meshio>=5.3",
]

[project.optional-dependencies]
# DAMASK grid export (dragen.export.export_damask)
damask = ["damask>=3.0.2"]
# grain sources from trained WGANs (.pkl) and their training code in InputGenerator
ml = ["torch>=2.2", "geomloss", "qhoptim", "matplotlib>=3.8", "seaborn", "tqdm"]
# rarely used helpers of the legacy code (shape analysis, rough surfaces, Exodus writer)
extra = ["opencv-python-headless", "perlin-noise", "netCDF4"]
# PyQt GUI (DRAGen.py) and the legacy generator behind it (DRAGen_nogui.py, dragen.run)
gui = [
    "PyQt5>=5.15", "damask>=3.0.2", "matplotlib>=3.8", "seaborn", "pyvista>=0.43", "vtk",
    "Pillow", "tetgen", "networkx", "scikit-learn", "tqdm",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dragen*", "InputGenerator*"]

[tool.setuptools.package-data]
dragen = ["thumbnails/*", "gui/static/*"]
